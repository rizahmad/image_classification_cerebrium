[cerebrium.deployment]
name = "image-classification"
python_version = "3.10"
docker_base_image_url = "python:3.12-bookworm"
disable_auth = true
include = ['./*']
exclude = ['.*']

[cerebrium.hardware]
cpu = 2.0
memory = 12.0
compute = "CPU"

[cerebrium.scaling]
min_replicas = 0
max_replicas = 5
cooldown = 30
replica_concurrency = 1
response_grace_period = 900
scaling_metric = "concurrency_utilization"
scaling_target = 100
scaling_buffer = 0
roll_out_duration_seconds = 0

